name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy src

  tests:
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --junitxml=reports/junit.xml
      - uses: dimagrotser/ai-test-failure-triage@v1
        if: ${{ !cancelled() }}
        with:
          junit: reports/junit.xml
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
