[project]
name = "ai-test-design-agents"
version = "0.1.0"
description = "Multi-agent test design from user stories, evaluated by mutation testing."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
]

[project.scripts]
atda = "atda.adapters.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["uv_build==0.11.6"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Domain names such as TestContext start with "Test". Our tests are plain functions.
python_classes = []
markers = ["live: one real API call, run by hand with a key"]
addopts = "-m 'not live'"

[tool.uv.build-backend]
module-name = "atda"
